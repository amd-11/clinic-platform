name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src scripts

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      # No DATABASE_URL here: the build skips migrations and the app falls back
      # to the embedded database, so the build stays independent of production data.
      - name: Build
        run: npm run build
